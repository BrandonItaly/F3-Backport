modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="f3backport.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${mc_version},${mc_version_next})"
ordering="NONE"
side="CLIENT"
